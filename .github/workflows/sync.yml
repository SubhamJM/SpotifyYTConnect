name: Sync Music Playlists

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  # Allows triggering manually via GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Spotify and YouTube Music
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Playlist Synchronizer
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          YTM_OAUTH_JSON: ${{ secrets.YTM_OAUTH_JSON }}
          YTM_BROWSER_JSON: ${{ secrets.YTM_BROWSER_JSON }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID || vars.SPOTIFY_PLAYLIST_ID }}
          YTMUSIC_PLAYLIST_ID: ${{ secrets.YTMUSIC_PLAYLIST_ID || vars.YTMUSIC_PLAYLIST_ID }}
          SYNC_DIRECTION: ${{ secrets.SYNC_DIRECTION || vars.SYNC_DIRECTION || 'both' }}
          SYNC_PAIRS: ${{ secrets.SYNC_PAIRS || vars.SYNC_PAIRS }}
        run: python main.py
