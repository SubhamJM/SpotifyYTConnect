[project]
name = "spotifyytconnect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SubhamJM", email = "subhamjyotimaharana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.0.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.9.0",
    "spotipy>=2.25.0",
    "ytmusicapi>=1.12.0",
]

[project.scripts]
spotifyytconnect = "spotifyytconnect:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
